        - listitem [ref=f1e256]: 本页为个人消费计量研究：付费用户测量自己账号的消费记录，属消费者知情权范畴；不构成对任何主体的指控，亦不构成法律意见。
        - listitem [ref=f1e257]: 费率卡为有限信息下的数学反演：全部给出量化区间而非单点断言；凡属解释性内容（如商业逻辑推测）在报告中均已单独标注为推测。
        - listitem [ref=f1e258]: 测量范围为单一账号、单档位、K3 High 模式、2026-09-21 当日；官方可随时调整计费规则，届时本报告相应内容转为历史记录。
        - listitem [ref=f1e259]: 测量误差受 0.01% 计费量化网格限制（单次最小分辨 ¥0.10）；我们以区间交集与总量回测双重控制该误差。
        - listitem [ref=f1e260]: 官方对 Allegretto 档位的宣传口径为"Agent 档额度的 4 倍"（档位间相对值）；本报告的"¥1,000 标价池 / 5.03×"为实测推算，两者口径不同，均已如实标注。截至测量日，官方未公示任何档位的额度绝对值与池内费率。
